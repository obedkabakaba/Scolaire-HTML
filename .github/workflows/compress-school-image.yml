name: Compress school homepage image

on:
  push:
    paths:
      - '.github/workflows/compress-school-image.yml'

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Compress WebP while preserving transparency
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import os

          path = Path('public/site/illustrations/ecole.webp')
          before_size = path.stat().st_size

          with Image.open(path) as src:
              src.load()
              original_mode = src.mode
              original_size = src.size
              rgba = src.convert('RGBA')
              alpha_before = rgba.getchannel('A').copy()

              tmp = path.with_suffix('.optimized.webp')
              rgba.save(
                  tmp,
                  'WEBP',
                  quality=80,
                  method=6,
                  exact=True,
                  lossless=False,
              )

          with Image.open(tmp) as check:
              check.load()
              if check.size != original_size:
                  raise SystemExit(f'Dimensions changed: {original_size} -> {check.size}')
              checked = check.convert('RGBA')
              alpha_after = checked.getchannel('A')
              if ImageChops.difference(alpha_before, alpha_after).getbbox() is not None:
                  raise SystemExit('Alpha/transparency changed; refusing to replace the image.')

          after_size = tmp.stat().st_size
          if after_size >= before_size:
              raise SystemExit(f'Compression did not reduce size: {before_size} -> {after_size}')

          os.replace(tmp, path)
          reduction = (1 - after_size / before_size) * 100
          print(f'Compressed {before_size} -> {after_size} bytes ({reduction:.1f}% smaller)')
          print(f'Mode before: {original_mode}; dimensions preserved: {original_size}')
          print('Alpha channel verified pixel-for-pixel unchanged.')
          PY

      - name: Commit optimized image and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compress-school-image.yml
          git add public/site/illustrations/ecole.webp
          git commit -m "Compress school homepage image without changing transparency"
          git push
