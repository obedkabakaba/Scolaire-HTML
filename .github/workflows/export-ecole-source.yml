name: Export ecole source
on:
  push:
    branches: [agent/export-ecole-source]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ecole-source
          path: public/site/illustrations/ecole.webp
