name: Ardoise Frontend Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: frontend/static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      # Tous les JavaScript versionnés à la racine, et non une liste écrite à
      # la main.
      #
      # L'énumération précédente couvrait cinq fichiers sur la quarantaine que
      # porte le dépôt : un fichier ajouté n'était vérifié par personne, et rien
      # ne le signalait. C'est la même dérive que celle qui avait laissé cinq
      # fichiers de test inexécutés côté backend — elle se répare de la même
      # façon, en décrivant un ENSEMBLE plutôt qu'une liste.
      #
      # Le compteur en fin d'étape n'est pas décoratif : si le motif cessait de
      # correspondre à quoi que ce soit, la boucle réussirait sans rien vérifier
      # et l'étape passerait au vert en n'ayant rien lu.
      - name: Syntaxe JavaScript
        run: |
          set -euo pipefail
          n=0
          for f in *.js; do
            [ -e "$f" ] || continue
            node --check "$f"
            n=$((n + 1))
          done
          echo "$n fichier(s) JavaScript vérifié(s)."
          if [ "$n" -lt 10 ]; then
            echo "ÉCHEC : seulement $n fichier(s) trouvé(s). L'exploration est cassée," >&2
            echo "et une étape qui ne lit rien ne prouve rien." >&2
            exit 1
          fi
      - name: Sécurité Offline / PWA
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const off=fs.readFileSync('hors-ligne.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const checks=[
            ['allowlist',off.includes('AUTORISEES')&&off.includes('differable(')],
            ['no-finance',!/motif\s*:\s*\/\^\\\/(frais|paiements)/.test(off)],
            ['no-admin',!/motif\s*:\s*\/\^\\\/(utilisateurs|super-admin)/.test(off)],
            ['tenant-context',off.includes('utilisateur_id')&&off.includes('ecole_id')&&off.includes('memeContexte')],
            ['recheck',off.includes('if(!differable(e.chemin,e.methode))')],
            ['no-shared-api-cache',!sw.includes('CACHE_DONNEES')],
            ['cross-origin-network-only',sw.includes('if(url.origin!==self.location.origin)')&&sw.includes('fetch(req)')]
          ];
          for(const [nom,ok] of checks) console.log(`${ok?'OK':'KO'} ${nom}`);
          const ko=checks.filter(x=>!x[1]);
          if(ko.length) throw new Error(`${ko.length} invariant(s) offline/PWA cassé(s)`);
          NODE
      - name: Audits statiques existants
        run: |
          python3 audit-frontend.py
          python3 audit-contrat-api.py || true

      - name: Illustrations des e-mails
        run: python3 test-email-assets.py

      # La divulgation progressive du tunnel d'abonnement ne se vérifie pas en
      # lisant le code : elle porte sur ce qui est RÉELLEMENT visible une fois
      # les styles et le script appliqués. Un `cache` retiré par mégarde
      # remettrait le numéro de dépôt et le champ de référence en haut de page
      # sans qu'aucun test statique ne s'en aperçoive.
      - name: Parcours abonnement / support (navigateur réel)
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 audit-parcours-abonnement.py
