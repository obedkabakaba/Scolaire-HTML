name: Export cahiers for precise cutout

on:
  push:
    paths:
      - '.github/workflows/redetourer-cahiers.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export image as base64 text
        run: |
          base64 -w 0 public/site/illustrations/cahiers.webp > .github/cahiers-image.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/redetourer-cahiers.yml
          git add .github/cahiers-image.b64
          git commit -m "Export cahiers image for cutout repair"
          git push
