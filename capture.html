<!DOCTYPE html>
<!--
  ARDOISE — ESPACE DE CAPTURE (campagne de capture sur le terrain)
  ---------------------------------------------------------------------
  Utilisé sur place, au téléphone, par :
    · un partenaire retenu sur la mission (jeton du portail partenaire) ;
    · l'équipe Ardoise quand elle mène la campagne (?mode=equipe, session
      de la console Super Admin, ouverte dans le même onglet).

  Le serveur décide à CHAQUE requête si l'accès est encore ouvert : fin de
  part, fin de mission, échéance, badge suspendu ferment la page aussitôt.
  Rien n'est conservé sur l'appareil : ni liste, ni photo, ni fiche.
-->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Espace de capture — Ardoise</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#141C18" />
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('ardoise.ap.theme'); } catch (e) {}
    if (t === 'clair' || t === 'sombre') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="espace-apporteur.css?v=20261016" />
<style>
  .cap { max-width: 860px; margin: 0 auto; padding: 0 16px 96px; }
  .cap-barre { position: sticky; top: 0; z-index: 20; background: var(--fond); padding: 12px 0 10px; border-bottom: 1px solid var(--bordure); margin-bottom: 14px; }
  .cap-barre-ligne { display: flex; align-items: center; gap: 10px; }
  .cap-barre h1 { font-family: var(--titre); font-size: 1.15rem; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-retour { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--bordure-2); background: var(--surface); color: var(--texte); cursor: pointer; flex: 0 0 38px; }
  .cap-retour svg, .cap svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cap-meta { font-size: .8rem; color: var(--texte-2); margin: 6px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .jauge { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .jauge > i { display: block; height: 100%; background: var(--vert); border-radius: 999px; transition: width .3s ease; }
  .cap-outils { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .cap-outils .saisie { flex: 1; min-width: 180px; }
  .cap-classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cap-classe { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--bordure); background: var(--surface); color: var(--texte); cursor: pointer; font: inherit; display: grid; gap: 8px; min-height: 92px; }
  .cap-classe:hover:not(:disabled) { border-color: var(--accent); }
  .cap-classe:disabled { opacity: .45; cursor: not-allowed; }
  .cap-classe strong { font-size: .98rem; }
  .cap-classe span { font-size: .8rem; color: var(--texte-2); }
  .cap-classe.complete { border-color: var(--vert); }
  .cap-liste { display: grid; gap: 6px; }
  .cap-eleve { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; border: 1px solid var(--bordure); background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: var(--texte); width: 100%; }
  .cap-eleve:hover { border-color: var(--accent); }
  .cap-vignette { width: 46px; height: 58px; border-radius: 9px; object-fit: cover; background: var(--surface-3); flex: 0 0 46px; display: grid; place-items: center; color: var(--texte-3); }
  .cap-eleve .nom { font-weight: 600; font-size: .94rem; }
  .cap-eleve .sous { font-size: .78rem; color: var(--texte-2); }
  .cap-eleve .etiquette { margin-left: auto; }
  .cap-fiche-photo { display: grid; gap: 10px; justify-items: center; margin-bottom: 14px; }
  .cap-cadre { width: 180px; height: 240px; border-radius: 16px; overflow: hidden; background: var(--surface-3); display: grid; place-items: center; color: var(--texte-3); position: relative; }
  .cap-cadre img { width: 100%; height: 100%; object-fit: cover; }
  .cap-cadre svg { width: 64px; height: 64px; }
  .cap-cadre .cap-envoi { position: absolute; inset: 0; background: rgba(10,15,12,.55); color: #fff; display: grid; place-items: center; font-size: .86rem; font-weight: 600; }
  .cap-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .cap-grille { grid-template-columns: 1fr; } }
  .cap-titre-section { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-3); margin: 14px 0 8px; }
  .cap-ferme { text-align: center; padding: 48px 12px; }
  .cap-ferme svg { width: 46px; height: 46px; color: var(--texte-3); }
  .cap-flottant { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; box-shadow: var(--ombre-forte); }
  .cap-doublon { border: 1px solid var(--bordure); border-radius: 12px; padding: 8px 10px; margin: 6px 0; font-size: .86rem; }
  .cap-vide { padding: 28px 8px; text-align: center; color: var(--texte-2); }
  .cap-choix-photo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .cap-choix-photo .bouton { width: 100%; }
  /* Caméra dans la page : plein écran, au-dessus de la fiche. */
  .cap-camera { position: fixed; inset: 0; z-index: 90; background: #0B0F0D; color: #F2EFE6; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .cap-camera-tete { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .cap-camera-tete strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-camera-tete .cap-retour { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
  .cap-camera-vue { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 0; }
  .cap-camera-vue video, .cap-camera-figee { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .cap-camera-vue video.miroir { transform: scaleX(-1); }
  .cap-camera-figee { object-fit: contain; }
  /* Cadre de visée 3:4 : ce qui est dedans est ce qui sera gardé. */
  .cap-camera-cadre { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .cap-camera-cadre span { height: min(78%, calc(100vw * 4 / 3 * .82)); aspect-ratio: 3 / 4; border: 2px solid rgba(255,255,255,.9); border-radius: 18px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.42); position: relative; }
  .cap-camera-cadre span::after { content: ""; position: absolute; left: 22%; right: 22%; top: 14%; bottom: 30%; border: 2px dashed rgba(255,255,255,.55); border-radius: 50%; }
  .cap-camera-figee:not([hidden]) ~ .cap-camera-cadre { display: none; }
  .cap-camera-etat { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: rgba(11,15,13,.86); }
  .cap-camera-etat[hidden] { display: none; }
  .cap-camera-erreur { max-width: 520px; text-align: left; display: grid; gap: 8px; font-size: .9rem; line-height: 1.45; }
  .cap-camera-erreur strong { font-size: 1.05rem; }
  .cap-aide { margin: 6px 0; padding-left: 18px; display: grid; gap: 6px; color: #D9DDD3; }
  .cap-camera-pied { padding: 14px 16px 18px; display: grid; gap: 10px; justify-items: center; }
  .cap-camera-pied > div { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; width: 100%; max-width: 520px; }
  .cap-camera-pied > div[data-mode="verif"] { grid-template-columns: 1fr 1fr; }
  .cap-camera-pied > div[hidden] { display: none; }
  .cap-declencheur { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: #fff; box-shadow: inset 0 0 0 4px #0B0F0D; cursor: pointer; justify-self: center; }
  .cap-declencheur:disabled { opacity: .35; cursor: not-allowed; }
  .cap-declencheur:active:not(:disabled) { transform: scale(.94); }
  .cap-camera-secondaire { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: .84rem; cursor: pointer; }
  .cap-camera-secondaire:first-child { justify-self: start; }
  .cap-camera-secondaire:last-child { justify-self: end; }
  .cap-camera-secondaire[hidden] { visibility: hidden; display: block; }
  .cap-camera-lien { background: none; border: 0; color: #D9DDD3; text-decoration: underline; font: inherit; font-size: .84rem; cursor: pointer; }
  input[type="file"].cap-fichier { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-retour" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-appareil" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></symbol>
  <symbol id="i-profil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-8 8"/></symbol>
  <symbol id="i-cadenas" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-suivant" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<main class="cap" id="cap" aria-live="polite">
  <p class="cap-vide"><span class="muet">Ouverture de l’espace de capture…</span></p>
</main>
<!-- Importer : galerie du téléphone ou fichier de l'ordinateur (pas d'attribut capture). -->
<input type="file" accept="image/jpeg,image/png,image/webp,image/*" class="cap-fichier" id="cap-fichier" aria-hidden="true" tabindex="-1" />
<!-- Appareil photo du système (téléphone), en complément de la caméra dans la page. -->
<input type="file" accept="image/*" capture="environment" class="cap-fichier" id="cap-appareil" aria-hidden="true" tabindex="-1" />
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="capture.js?v=20261017"></script>
</body>
</html>
