<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.ico" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png" />
<meta name="theme-color" content="#1F2B24" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ardoise" />
<link rel="apple-touch-icon" sizes="180x180" href="icone-ios-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
  /* Thème avant le premier affichage (même règle que les autres écrans). */
  (function(){var t;
   try{t=localStorage.getItem('ardoise_theme')||sessionStorage.getItem('ardoise_theme');}catch(e){}
   var th=(t&&/^[a-z][a-z0-9-]{1,19}$/.test(t))?t:'ardoise';
   document.documentElement.setAttribute('data-theme', th);
   /* Retour arrière depuis « Mon profil » : la page revient du cache avec
      l'ancienne apparence. On relit le choix enregistré. */
   function relire(){var t2;try{t2=localStorage.getItem('ardoise_theme')||sessionStorage.getItem('ardoise_theme');}catch(e){}
     if(t2&&/^[a-z][a-z0-9-]{1,19}$/.test(t2)&&t2!==document.documentElement.getAttribute('data-theme')){document.documentElement.setAttribute('data-theme',t2);
       try{document.dispatchEvent(new CustomEvent('ardoise:theme-change',{detail:{theme:t2}}));}catch(e){}}}
   window.ArdoiseRelireTheme=relire;
   /* Appareil mobile ou ordinateur (même règle que mobile.js), avant le premier affichage. */
   try{var ua=navigator.userAgent||'';var mob=matchMedia('(hover: none) and (pointer: coarse)').matches||matchMedia('(display-mode: standalone)').matches||/Android.+Mobile|iPhone|iPod|Windows Phone/i.test(ua)||navigator.standalone===true;
     document.documentElement.classList.add(mob?'ard-appareil-mobile':'ard-ordinateur');}catch(e){}
   window.addEventListener('pageshow',function(e){if(e.persisted)relire();});
   window.addEventListener('storage',function(e){if(e.key==='ardoise_theme')relire();});
   document.addEventListener('visibilitychange',function(){if(!document.hidden)relire();});})();
</script>
<!-- Seules les VARIABLES du thème sont chargées : cet espace a sa propre
     coque (préfixe cf-), que les habillages d'école ne doivent pas restyler. -->
<link rel="stylesheet" href="theme-base.css" />
<!-- Les couleurs de TOUTES les apparences (variables seulement). -->
<link rel="stylesheet" href="theme-variables.css?v=1" />
<link rel="stylesheet" href="centre-formation.css?v=9" />
<!-- La coque « application » du téléphone et le didacticiel : les mêmes que
     dans l'espace des écoles (barre d'onglets, menu en feuille, accueil,
     projecteur, checklist). -->
<link rel="stylesheet" href="mobile.css" />
<link rel="stylesheet" href="didacticiel.css?v=3" />
<!-- L'animation d'accueil de la première connexion (theme-signatures.js). -->
<link rel="stylesheet" href="theme-signatures.css" />
<!-- Session partagée : renouvellement du jeton, rejeu des requêtes expirées,
     écran de blocage d'abonnement. Doit rester AVANT le script de la page. -->
<script src="session.js"></script>
<script src="remontee-erreurs.js"></script>
<script src="detourage.js?v=1"></script>
</head>
<body class="cf-racine">
<div class="cf-coque mise-en-page">
  <nav class="cf-rail barre-laterale" id="cf-rail" aria-label="Menu du centre">
    <div class="cf-rail-contenu">
      <div class="marque cf-marque">Ardo<span class="lettre-i">ı<span class="point-i-marque"></span></span>se<small>Centre de formation</small></div>
      <div class="cf-centre-nom" id="cf-centre"></div>
      <ul class="cf-nav nav-liste" id="cf-nav"></ul>
    </div>
    <button class="nav-deconnexion cf-deconnexion" type="button" id="cf-deconnexion">↩ Se déconnecter</button>
  </nav>
  <main class="cf-principal" id="cf-principal">
    <div id="cf-chargement-initial" class="cf-chargement">Ouverture de l’espace du centre…</div>
  </main>
</div>
<!-- mobile.js, didacticiel.js et theme-signatures.js lisent le rail : c'est
     centre-formation.js qui les charge, une fois le rail dessiné. -->
<script src="centre-formation.js?v=12"></script>
<script src="notifications-push.js"></script>
</body>
</html>
