  <style>
    :root {
      --ardoise: #1F2B24; --craie: #F6F2E7; --craie-2: #FBF9F3;
      --ocre: #C98A3E; --ocre-dark: #A96F2E; --encre: #3C5A62;
      --rouge: #B23A2E; --vert-ok: #4C7A5A;
      --texte-sombre: #1F2B24; --texte-att: #6B7269; --bordure: #E4DFCF;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--police-corps); color: var(--texte-sombre); background: var(--craie); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .carte {
      background: var(--craie-2);
      border: 1px solid var(--bordure);
      border-radius:  var(--r-carte);
      padding: 36px;
      max-width: 400px;
      width: 100%;
    }
    .carte h1 {
      font-family: var(--police-titre);
      font-weight: 600;
      font-size: 1.6rem;
      margin: 0 0 4px 0;
    }
    .carte .sous-titre {
      color: var(--texte-att);
      font-size: 0.9rem;
      margin: 0 0 28px 0;
    }

    .champ { margin-bottom: 16px; }
    .champ label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--texte-att);
      margin-bottom: 6px;
    }
    .champ input {
      width: 100%;
      padding: 11px 13px;
      font-size: 0.92rem;
      font-family: var(--police-corps);
      border: 1.5px solid var(--bordure);
      border-radius:  var(--r-bouton);
      background: #fff;
      color: var(--texte-sombre);
    }
    .champ input:focus { outline: none; border-color: var(--encre); }

    .bouton {
      padding: 11px 18px;
      border-radius:  var(--r-bouton);
      font-family: var(--police-corps);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      width: 100%;
    }
    .bouton-principal {
      background: var(--ocre);
      color: var(--craie-2);
    }
    .bouton-principal:hover { background: var(--ocre-dark); }
    .bouton:disabled { opacity: 0.55; cursor: not-allowed; }

    .message {
      display: none;
      padding: 10px 12px;
      border-radius:  var(--r-bouton);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .message.visible { display: block; }
    .message.succes { background: rgba(76,122,90,0.1); color: var(--vert-ok); }
    .message.erreur { background: rgba(178,58,46,0.08); color: var(--rouge); }

    .lien-retour {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--encre);
      text-decoration: none;
    }
    .lien-retour:hover { text-decoration: underline; }
  </style>
</head>

  <div class="carte">
    <h1>Changer mon mot de passe</h1>
    <p class="sous-titre">Super Admin — vous devez remplacer votre mot de passe provisoire.</p>

    <div class="message" id="message-flash"></div>

    <form id="formulaire-changement">
      <div class="champ">
        <label for="ancien">Mot de passe actuel</label>
        <input type="password" id="ancien" required autocomplete="current-password" />
      </div>
      <div class="champ">
        <label for="nouveau">Nouveau mot de passe</label>
        <input type="password" id="nouveau" required autocomplete="new-password" minlength="6" />
      </div>
      <div class="champ">
        <label for="confirmation">Confirmer le nouveau mot de passe</label>
        <input type="password" id="confirmation" required autocomplete="new-password" />
      </div>
      <button type="submit" class="bouton bouton-principal" id="bouton-envoyer">Changer le mot de passe</button>
    </form>

    <a href="super-admin.html" class="lien-retour">← Retour au panneau Super Admin</a>
  </div>

  <script>
    // ---------- FONCTION QUI RÉCUPÈRE LE TOKEN ----------
    function obtenirTokenAdmin() {
      return localStorage.getItem('ardoise_admin_access_token');
    }

    // ---------- SOUMISSION DU FORMULAIRE ----------
    document.getElementById('formulaire-changement').addEventListener('submit', async (evt) => {
      evt.preventDefault();
      const ancien = document.getElementById('ancien').value;
      const nouveau = document.getElementById('nouveau').value;
      const confirmation = document.getElementById('confirmation').value;

      const zone = document.getElementById('message-flash');
      zone.classList.remove('visible', 'succes', 'erreur');

      if (nouveau.length < 6) {
        zone.textContent = 'Le nouveau mot de passe doit contenir au moins 6 caractères.';
        zone.className = 'message visible erreur';
        return;
      }
      if (nouveau !== confirmation) {
        zone.textContent = 'Les mots de passe ne correspondent pas.';
        zone.className = 'message visible erreur';
        return;
      }

      // Récupérer le token directement depuis localStorage
      const token = obtenirTokenAdmin();
      if (!token) {
        zone.textContent = 'Aucun token trouvé. Veuillez vous reconnecter.';
        zone.className = 'message visible erreur';
        setTimeout(() => {
          window.location.href = 'super-admin.html';
        }, 2000);
        return;
      }

      const bouton = document.getElementById('bouton-envoyer');
      bouton.disabled = true;
      bouton.textContent = 'Envoi…';

      try {
        const reponse = await fetch('https://scolaire-saas-backend.onrender.com/utilisateurs/moi/changer-mot-de-passe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            ancien_mot_de_passe: ancien,
            nouveau_mot_de_passe: nouveau
          })
        });

        const donnees = await reponse.json();

        if (!reponse.ok) {
          // Si 401, c'est que le token est invalide ou expiré
          if (reponse.status === 401) {
            zone.textContent = 'Session expirée. Veuillez vous reconnecter.';
            zone.className = 'message visible erreur';
            localStorage.removeItem('ardoise_admin_access_token');
            localStorage.removeItem('ardoise_admin_refresh_token');
            setTimeout(() => {
              window.location.href = 'super-admin.html';
            }, 2000);
            return;
          }
          throw new Error(donnees.message || 'Erreur inconnue');
        }

        zone.textContent = donnees.message || 'Mot de passe changé avec succès.';
        zone.className = 'message visible succes';
        document.getElementById('formulaire-changement').reset();
        // Redirection après 2 secondes
        setTimeout(() => {
          window.location.href = 'super-admin.html';
        }, 2000);

      } catch (err) {
        zone.textContent = err.message || 'Erreur inconnue.';
        zone.className = 'message visible erreur';
      } finally {
        bouton.disabled = false;
        bouton.textContent = 'Changer le mot de passe';
      }
    });

    // ---------- VÉRIFICATION INITIALE ----------
    (function verifierToken() {
      const token = obtenirTokenAdmin();
      if (!token) {
        const zone = document.getElementById('message-flash');
        zone.textContent = '⚠ Aucune session active. Veuillez vous connecter.';
        zone.className = 'message visible erreur';
        document.getElementById('bouton-envoyer').disabled = true;
        setTimeout(() => {
          window.location.href = 'super-admin.html';
        }, 2000);
      }
    })();
  </script>
</body>
</html>
